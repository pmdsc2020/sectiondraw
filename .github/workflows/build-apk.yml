name: Build SectionDraw APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project (permissions, app name)
        run: bash tool/prepare_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SectionDraw.apk

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SectionDraw-apk
          path: SectionDraw.apk

      - name: Publish APK to the "apk-latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest SectionDraw.apk \
            --target "$GITHUB_SHA" \
            --title "SectionDraw - latest APK" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). Install on Android (allow 'Install unknown apps')."

      - name: Unit tests (survey calculations)
        run: flutter test
